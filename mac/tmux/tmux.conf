# tmux.conf — ghostty + macOS, works nested and on remote hosts.
# reload: prefix r

# --- terminal -----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:clipboard:extkeys:usstyle:strikethrough"
set -as terminal-features ",xterm-256color:RGB:hyperlinks:clipboard"
set -s escape-time 10
set -s extended-keys on
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 250000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g mode-keys vi
set -g status-keys emacs

# --- mouse: select, scroll, click — but never resize --------------------
set -g mouse on
unbind -n MouseDrag1Border
unbind -n DoubleClick1Pane
setw -g aggressive-resize on
set -g window-size latest

# --- clipboard ----------------------------------------------------------
# OSC 52 carries copies out to ghostty -> macOS clipboard, also from nested
# or remote tmux. pbcopy as a belt-and-braces path when local.
set -s set-clipboard on
if -b 'command -v pbcopy >/dev/null' 'set -s copy-command pbcopy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
# paste: cmd+v (ghostty) works everywhere; prefix ] pastes the tmux buffer.

# --- keys ---------------------------------------------------------------
# prefix stays C-b. In a nested tmux, prefix b sends C-b to the inner one,
# or press F12 to put this (outer) tmux to sleep so every key goes inside.
bind b send-prefix
bind r source-file ~/.tmux.conf \; display "reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize only from the keyboard (repeatable: prefix H H H …)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind = select-layout -E

# sessions
bind S command-prompt -p "new session:" "new-session -s '%%'"
bind R command-prompt -I "#S" -p "rename session:" "rename-session '%%'"
bind C command-prompt -p "session color (#hex):" "set @accent '%%' ; set @accent_manual 1"
bind s choose-tree -Zs

# url picker
bind u display-popup -E -w 80% -h 60% "~/.local/bin/tmux-urls '#{pane_id}'"

# --- nested: F12 toggles this tmux off/on ------------------------------
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  if -F '#{pane_in_mode}' 'send -X cancel' \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  refresh-client -S

# --- colors: every session gets its own accent --------------------------
set -g @accent "#bd93f9"
set-hook -g session-created  'run -b "~/.local/bin/tmux-session-color \"#{hook_session_name}\""'
set-hook -g session-renamed  'run -b "~/.local/bin/tmux-session-color \"#{session_name}\""'
run -b '~/.local/bin/tmux-session-color --all'

BG="#1e1f29"
BG2="#343746"
FG="#f8f8f2"
DIM="#6272a4"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=$BG,fg=$FG"
set -g message-style "bg=#{@accent},fg=$BG,bold"
set -g message-command-style "bg=$BG2,fg=#{@accent}"
setw -g mode-style "bg=#{@accent},fg=$BG"
set -g popup-border-style "fg=#{@accent}"
set -g popup-border-lines rounded

setw -g pane-border-lines heavy
setw -g pane-border-style "fg=$BG2"
setw -g pane-active-border-style "fg=#{@accent}"
setw -g pane-border-indicators arrows
set -g display-panes-active-colour "#{@accent}"
set -g display-panes-colour "$DIM"

setw -g monitor-activity on
set -g visual-activity off
set -g activity-action other

# left: big session badge. When F12'd off: grey with "OFF" so you know keys pass through.
set -g status-left-length 40
set -g status-left "#{?#{==:#{client_key_table},off},#[bg=$BG2 fg=$DIM bold] OFF #S ,#[bg=#{@accent} fg=$BG bold] #S #{?client_prefix,#[reverse] ^B #[noreverse],}}#[default] "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=$DIM] #I #[fg=$FG]#W#{?window_zoomed_flag, 󰊓,}#{?window_activity_flag,#[fg=#ffb86c] •,} "
setw -g window-status-current-format "#[bg=$BG2 fg=#{@accent} bold] #I #W#{?window_zoomed_flag, 󰊓,} "

# right: network (local mac only) + host when remote + clock
set -g status-right-length 120
set -g status-right "#(~/.local/bin/tmux-netstatus) #[fg=$DIM]│ #[fg=$FG]%a %H:%M "

# --- remote / nested-over-ssh flavor -----------------------------------
# A tmux started from an ssh session puts its bar on TOP and shows the host,
# so local (bottom) and remote (top) are never confused.
if -b '[ -n "$SSH_CONNECTION" ]' {
  set -g status-position top
  set -g status-right "#[fg=$DIM]#h #[fg=$FG]%H:%M "
}

# local overrides (not in git)
if -b '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
